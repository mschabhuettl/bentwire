[package]
name = "bentwired"
description = "bentwire daemon: Microsoft Agent style desktop characters on Wayland"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bentwire-character.workspace = true
bentwire-core.workspace = true
bentwire-render.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
png.workspace = true
sha2.workspace = true
zbus = "5"
calloop = { version = "0.14", features = ["signals"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
rodio = { version = "0.21", default-features = false, features = ["playback"] }
smithay-client-toolkit = "0.21"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }

[dev-dependencies]
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
serde_json.workspace = true
