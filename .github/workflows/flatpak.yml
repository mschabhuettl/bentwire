name: Flatpak

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  files:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils
          # tomlkit 0.12 (Ubuntu) writes an extra "[source]" line into the cargo config
          pip install --break-system-packages tomlkit==0.13.3 aiohttp==3.13.3
      - name: cargo-sources.json matches Cargo.lock
        run: scripts/flatpak-cargo-sources.sh --check
      - name: AppStream metainfo and desktop file
        run: |
          appstreamcli validate --no-net packaging/flatpak/org.bentwire.Agent.metainfo.xml
          desktop-file-validate packaging/flatpak/org.bentwire.Agent.desktop

  bundle:
    # Plain runner with scripts/flatpak-build.sh: the flatpak-github-actions container
    # image failed to update its preinstalled SDK ("Invalid cross-device link").
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build the bundle
        run: scripts/flatpak-build.sh "$PWD/bentwire-x86_64.flatpak"
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-bundle
          path: bentwire-x86_64.flatpak
          if-no-files-found: error
