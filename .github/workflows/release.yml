name: Release

on:
  push:
    tags: ["v*"]
  # Dry run from a branch: builds and checks every asset and sha256sums.txt with the version
  # from Cargo.toml, but creates no release.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-gnu

jobs:
  # Binaries, the tarball and the .deb and .rpm made from the same binaries.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v=${GITHUB_REF_NAME#v}
          else v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1); fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libasound2-dev pkg-config dbus
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: x86_64-unknown-linux-gnu
      - name: Build
        run: |
          cargo build --release --locked --target "$TARGET" \
            -p bentwired -p bentwire -p bentwire-convert -p bentwire-notify -p bentwire-mqtt \
            --bin bentwired --bin bentwire --bin bentwire-convert \
            --bin bentwire-notify --bin bentwire-mqtt
      - name: Tarball
        run: |
          name="bentwire-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/bentwired" "target/$TARGET/release/bentwire" \
            "target/$TARGET/release/bentwire-convert" "target/$TARGET/release/bentwire-notify" \
            "target/$TARGET/release/bentwire-mqtt" \
            README.md CHANGELOG.md LICENSE-APACHE LICENSE-MIT "dist/$name/"
          mkdir -p "dist/$name/characters" "dist/$name/fonts"
          cp -r characters/builtin "dist/$name/characters/"
          cp -r packaging "dist/$name/"
          cp -a clients "dist/$name/"
          cp assets/fonts/LICENSE-LGPL-2.1.txt assets/fonts/README.md "dist/$name/fonts/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - name: .deb and .rpm
        run: |
          scripts/nfpm-install.sh "$RUNNER_TEMP/bin"
          PATH="$RUNNER_TEMP/bin:$PATH" scripts/package-build.sh "$VERSION" \
            "target/$TARGET/release" dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  packages-check:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { ext: deb, image: "docker.io/library/debian:trixie" }
          - { ext: deb, image: "docker.io/library/ubuntu:24.04" }
          - { ext: rpm, image: "docker.io/library/fedora:43" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Install, run and remove in a fresh container
        env:
          CONTAINER: docker
        run: scripts/package-check.sh dist/*.${{ matrix.ext }} "${{ matrix.image }}"

  flatpak:
    uses: ./.github/workflows/flatpak.yml

  # The only job that creates the release: all assets, one sha256sums.txt over all of them.
  publish:
    needs: [build, packages-check, flatpak]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v=${GITHUB_REF_NAME#v}
          else v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1); fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Assets and sha256sums.txt
        run: |
          cd release
          mv bentwire-x86_64.flatpak "bentwire-$VERSION-x86_64.flatpak"
          # Exactly these; only the tarball's name may contain "tar.gz" (the AUR scripts
          # grep for it in sha256sums.txt).
          expected=$(printf '%s\n' "bentwire-$VERSION-$TARGET.tar.gz" \
            "bentwire-$VERSION-x86_64.flatpak" "bentwire_$VERSION-1_amd64.deb" \
            "bentwire-$VERSION-1.x86_64.rpm" | sort)
          actual=$(find . -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          if [ "$actual" != "$expected" ]; then
            printf 'unexpected release assets:\n%s\nexpected:\n%s\n' "$actual" "$expected"
            exit 1
          fi
          # shellcheck disable=SC2086 # the names have no spaces
          sha256sum $expected > sha256sums.txt
          cat sha256sums.txt
      - name: Release notes from CHANGELOG.md
        run: scripts/changelog-notes.sh "$VERSION" CHANGELOG.md > notes.md
      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "bentwire $GITHUB_REF_NAME" \
            --notes-file notes.md release/*
