name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-gnu

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libasound2-dev pkg-config dbus
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: x86_64-unknown-linux-gnu
      - name: Build
        run: |
          cargo build --release --locked --target "$TARGET" \
            -p bentwired -p bentwire -p bentwire-convert \
            --bin bentwired --bin bentwire --bin bentwire-convert
      - name: Package
        run: |
          version=${GITHUB_REF_NAME#v}
          name="bentwire-$version-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/bentwired" "target/$TARGET/release/bentwire" \
            "target/$TARGET/release/bentwire-convert" \
            README.md CHANGELOG.md LICENSE-APACHE LICENSE-MIT "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > sha256sums.txt)
      - name: Release notes from CHANGELOG.md
        run: scripts/changelog-notes.sh "${GITHUB_REF_NAME#v}" CHANGELOG.md > notes.md
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "bentwire $GITHUB_REF_NAME" \
            --notes-file notes.md dist/*.tar.gz dist/sha256sums.txt
