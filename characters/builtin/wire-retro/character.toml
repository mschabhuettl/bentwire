# Wire (retro), bentwire's own character, generated by `cargo run -p bentwire-convert --bin gen-builtin`
# from the vector rig in crates/bentwire-convert/src/wire/. CC0-1.0 (see LICENSE).
format = 1
family = "agent"

[character]
canvas = [128, 128]

[[character.info]]
lang = "en"
name = "Wire (retro)"
description = "Wire as in 1997: 12 colours, hard edges, drawn by code (CC0)."
extra = "Hi, I'm Wire, a piece of bent wire with a face. Bent, but never broken!~~Hello! I'm made of code, from my coil to my curl."

[[character.info]]
lang = "de"
name = "Wire (retro)"
description = "Wire wie 1997: 12 Farben, harte Kanten, per Code gezeichnet (CC0)."
extra = "Hallo, ich bin Wire, ein Stück gebogener Draht mit Gesicht. Verbogen, aber nie gebrochen!~~Hallo! Ich bin aus Code gemacht, von der Feder bis zur Locke."

[balloon]
enabled = true
lines = 2
chars_per_line = 32
fg = "#000000"
bg = "#FFFFE1"
border = "#000000"
font = "Tahoma"
font_height = -11
font_weight = 400
italic = false
size_to_text = true
auto_hide = true
auto_pace = true

[icon]
file = "icon.png"

[[sheets]]
id = "a"
file = "sheets/a.png"
cell = [128, 128]
count = 170

[[sheets]]
id = "m"
file = "sheets/m.png"
cell = [14, 10]
count = 8

[sounds]
show = "sounds/show.flac"
hide = "sounds/hide.flac"

[states]
Showing = ["Show"]
Hiding = ["Hide"]
Speaking = ["Speak"]
Listening = ["StartListening"]
Hearing = ["Hearing_1"]
MovingUp = ["MoveUp"]
MovingDown = ["MoveDown"]
MovingLeft = ["MoveLeft"]
MovingRight = ["MoveRight"]
GesturingUp = ["GestureUp"]
GesturingDown = ["GestureDown"]
GesturingLeft = ["GestureLeft"]
GesturingRight = ["GestureRight"]
IdlingLevel1 = ["Idle1_1", "Idle1_2", "Idle1_3", "Idle1_4", "Idle1_5"]
IdlingLevel2 = ["Idle2_1", "Idle2_2", "Idle1_2", "Idle1_4"]
IdlingLevel3 = ["Idle3_1", "Idle3_2"]

