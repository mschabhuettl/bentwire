# bentwire placeholder character, generated by `cargo run -p bentwire-convert --bin gen-builtin`.
# CC0-1.0. Template for hand-made characters: edit this file and the PNG sheets.
format = 1
family = "agent"

[character]
canvas = [96, 96]

[[character.info]]
lang = "en"
name = "Placeholder"
description = "bentwire's own stand-in: a wire clip drawn by code (CC0)."

[[character.info]]
lang = "de"
name = "Platzhalter"
description = "bentwires eigener Ersatz: eine per Code gezeichnete Drahtklammer (CC0)."

[balloon]
enabled = true
lines = 2
chars_per_line = 32
fg = "#000000"
bg = "#FFFFE1"
border = "#000000"
font = "Tahoma"
font_height = -11
font_weight = 400
italic = false
size_to_text = true
auto_hide = true
auto_pace = true

[icon]
file = "icon.png"

[[sheets]]
id = "a"
file = "sheets/a.png"
cell = [96, 96]
count = 61
[sheets.hidpi]
2 = "sheets/a@2x.png"

[[sheets]]
id = "m"
file = "sheets/m.png"
cell = [14, 10]
count = 7
[sheets.hidpi]
2 = "sheets/m@2x.png"

[sounds]
pop = "sounds/pop.flac"

[states]
Showing = ["Show"]
Hiding = ["Hide"]
Speaking = ["Speak"]
Listening = ["Alert"]
Hearing = ["Hearing_1"]
MovingUp = ["MoveUp"]
MovingDown = ["MoveDown"]
MovingLeft = ["MoveLeft"]
MovingRight = ["MoveRight"]
GesturingUp = ["GestureUp"]
GesturingDown = ["GestureDown"]
GesturingLeft = ["GestureLeft"]
GesturingRight = ["GestureRight"]
IdlingLevel1 = ["Idle1_1", "IdleBlink"]
IdlingLevel2 = ["IdleLookAround", "IdleBlink", "Idle1_1"]
IdlingLevel3 = ["IdleSnooze", "IdleSpin"]

